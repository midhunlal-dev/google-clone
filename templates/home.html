{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
  <script src="{% static 'js/home.js' %}" defer></script>
</head>
<body>

  
  <header class="topbar">
    <nav class="topbar-left">
      <a href="https://about.google/">About</a>
      <a href="https://store.google.com/">Store</a>
    </nav>

    <nav class="topbar-right">
      <a href="https://mail.google.com/">Gmail</a>
      <a href="https://www.google.com/imghp">Images</a>

      <button class="icon-btn" aria-label="Google apps">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
          <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
          <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
        </svg>
      </button>

      <a class="sign-in" href="https://accounts.google.com/">Sign in</a>
    </nav>
  </header>

  
  <main class="main">
    <h1 class="logo" aria-label="Google">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </h1>

    <form class="search-form" action="https://www.google.com/search" method="get">
      <div class="search-box">
        <svg class="icon-search" viewBox="0 0 24 24" width="20" height="20" fill="#9aa0a6">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input type="text" name="q" autocomplete="off" autofocus aria-label="Search">

        <svg class="icon-mic" viewBox="0 0 24 24" width="24" height="24">
          <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path fill="#34a853" d="M11 18.08V21h2v-2.92z"/>
          <path fill="#fbbc05" d="M7 11H5c0 3.53 2.61 6.43 6 6.92V16.9A5 5 0 0 1 7 11z"/>
          <path fill="#ea4335" d="M17 11a5 5 0 0 1-4 4.9v2.02c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>

      <div class="buttons">
        <button type="submit">Google Search</button>
        <button type="button" id="lucky-btn">I'm Feeling Lucky</button>
      </div>
    </form>
  </main>

  
  <footer class="footer">
    <div class="footer-top">India</div>

    <div class="footer-bottom">
      <nav class="footer-left">
        <a href="https://ads.google.com/">Advertising</a>
        <a href="https://www.google.com/services/">Business</a>
        <a href="https://google.com/search/howsearchworks/">How Search works</a>
      </nav>

      <nav class="footer-right">
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <a href="https://www.google.com/preferences">Settings</a>
      </nav>
    </div>
  </footer>

</body>
</html>
